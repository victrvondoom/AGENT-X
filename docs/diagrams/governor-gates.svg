<svg viewBox="0 0 900 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Governor evaluates five ordered gates; any gate before the fifth can force authorization regardless of the granted autonomy level">
  <defs>
    <marker id="arr3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b6b76"/>
    </marker>
    <marker id="arrHold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#eab308"/>
    </marker>
  </defs>
  <rect width="900" height="560" fill="#0d1117"/>

  <g font-family="ui-monospace, monospace" font-size="12.5">
    <!-- action request -->
    <rect x="330" y="15" width="240" height="44" rx="8" fill="#1c2333" stroke="#8b8ba0"/>
    <text x="450" y="42" fill="#e6e6ef" text-anchor="middle">action request, case_level = 4</text>
    <line x1="450" y1="59" x2="450" y2="80" stroke="#6b6b76" stroke-width="1.6" marker-end="url(#arr3)"/>

    <!-- gate 1 -->
    <rect x="300" y="80" width="300" height="50" rx="8" fill="#1c2333" stroke="#8b8ba0"/>
    <text x="450" y="103" fill="#e6e6ef" text-anchor="middle">① blocking contradiction on case?</text>
    <text x="450" y="120" fill="#8b8ba0" text-anchor="middle" font-size="10.5">refuse non-inspect actions</text>
    <line x1="600" y1="105" x2="700" y2="105" stroke="#eab308" stroke-width="1.6" marker-end="url(#arrHold)"/>
    <text x="710" y="101" fill="#fbbf24" font-size="11.5">yes →</text>
    <text x="710" y="115" fill="#fbbf24" font-size="11.5">REFUSED</text>
    <line x1="450" y1="130" x2="450" y2="150" stroke="#6b6b76" stroke-width="1.6" marker-end="url(#arr3)"/>
    <text x="465" y="145" fill="#8b8ba0" font-size="11">no</text>

    <!-- gate 2 -->
    <rect x="300" y="150" width="300" height="50" rx="8" fill="#1c2333" stroke="#8b8ba0"/>
    <text x="450" y="173" fill="#e6e6ef" text-anchor="middle">② confidence &lt; risk-class floor?</text>
    <text x="450" y="190" fill="#8b8ba0" text-anchor="middle" font-size="10.5">0.55 / 0.70 / 0.85 for low/med/high</text>
    <line x1="600" y1="175" x2="700" y2="175" stroke="#eab308" stroke-width="1.6" marker-end="url(#arrHold)"/>
    <text x="710" y="171" fill="#fbbf24" font-size="11.5">yes →</text>
    <text x="710" y="185" fill="#fbbf24" font-size="11.5">REFUSED</text>
    <line x1="450" y1="200" x2="450" y2="220" stroke="#6b6b76" stroke-width="1.6" marker-end="url(#arr3)"/>
    <text x="465" y="215" fill="#8b8ba0" font-size="11">no</text>

    <!-- gate 3 -->
    <rect x="300" y="220" width="300" height="50" rx="8" fill="#1c2333" stroke="#8b8ba0"/>
    <text x="450" y="243" fill="#e6e6ef" text-anchor="middle">③ irreversible and high-risk?</text>
    <text x="450" y="260" fill="#8b8ba0" text-anchor="middle" font-size="10.5">overrides even level 4</text>
    <line x1="600" y1="245" x2="700" y2="245" stroke="#eab308" stroke-width="1.6" marker-end="url(#arrHold)"/>
    <text x="710" y="241" fill="#fbbf24" font-size="11.5">yes →</text>
    <text x="710" y="255" fill="#fbbf24" font-size="11.5">HELD</text>
    <line x1="450" y1="270" x2="450" y2="290" stroke="#6b6b76" stroke-width="1.6" marker-end="url(#arr3)"/>
    <text x="465" y="285" fill="#8b8ba0" font-size="11">no</text>

    <!-- gate 4 -->
    <rect x="300" y="290" width="300" height="50" rx="8" fill="#1c2333" stroke="#8b8ba0"/>
    <text x="450" y="313" fill="#e6e6ef" text-anchor="middle">④ amount &gt; grant ceiling?</text>
    <text x="450" y="330" fill="#8b8ba0" text-anchor="middle" font-size="10.5">default 25,000 minor units</text>
    <line x1="600" y1="315" x2="700" y2="315" stroke="#eab308" stroke-width="1.6" marker-end="url(#arrHold)"/>
    <text x="710" y="311" fill="#fbbf24" font-size="11.5">yes →</text>
    <text x="710" y="325" fill="#fbbf24" font-size="11.5">HELD</text>
    <line x1="450" y1="340" x2="450" y2="360" stroke="#6b6b76" stroke-width="1.6" marker-end="url(#arr3)"/>
    <text x="465" y="355" fill="#8b8ba0" font-size="11">no</text>

    <!-- gate 5 -->
    <rect x="300" y="360" width="300" height="50" rx="8" fill="#1c2333" stroke="#8b8ba0"/>
    <text x="450" y="383" fill="#e6e6ef" text-anchor="middle">⑤ level_granted ≥ level_required?</text>
    <text x="450" y="400" fill="#8b8ba0" text-anchor="middle" font-size="10.5">the only plain integer comparison</text>
    <line x1="600" y1="385" x2="700" y2="385" stroke="#eab308" stroke-width="1.6" marker-end="url(#arrHold)"/>
    <text x="710" y="381" fill="#fbbf24" font-size="11.5">no →</text>
    <text x="710" y="395" fill="#fbbf24" font-size="11.5">HELD</text>
    <line x1="450" y1="410" x2="450" y2="440" stroke="#16a34a" stroke-width="1.8" marker-end="url(#arr3)"/>
    <text x="470" y="430" fill="#4ade80" font-size="11.5">yes</text>

    <rect x="330" y="440" width="240" height="50" rx="8" fill="#0f2318" stroke="#16a34a" stroke-width="2"/>
    <text x="450" y="470" fill="#4ade80" text-anchor="middle">ALLOWED — executed unattended</text>

    <!-- held/refused terminal box -->
    <rect x="680" y="440" width="180" height="50" rx="8" fill="#2a2410" stroke="#eab308" stroke-width="2"/>
    <text x="770" y="463" fill="#fde68a" text-anchor="middle" font-size="12">requires_authorization</text>
    <text x="770" y="479" fill="#fde68a" text-anchor="middle" font-size="10.5">= True regardless of level</text>
  </g>

  <text x="450" y="530" fill="#8b8ba0" font-family="ui-monospace, monospace" font-size="12" text-anchor="middle">
    gates ①–④ can force a hold at ANY granted level, including 4 — only gate ⑤ reads the level itself
  </text>
</svg>
