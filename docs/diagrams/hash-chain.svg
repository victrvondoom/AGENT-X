<svg viewBox="0 0 980 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Hash chain recurrence: each entry hashes the previous hash concatenated with its own canonical payload; altering entry 2 breaks every hash from that point forward">
  <defs>
    <marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b6b76"/>
    </marker>
  </defs>
  <rect width="980" height="320" fill="#0d1117"/>

  <!-- genesis -->
  <g font-family="ui-monospace, monospace" font-size="11.5">
    <rect x="20" y="60" width="120" height="60" rx="8" fill="#1c2333" stroke="#8b8ba0"/>
    <text x="80" y="84" fill="#e6e6ef" text-anchor="middle">GENESIS</text>
    <text x="80" y="100" fill="#8b8ba0" text-anchor="middle">h₀ = "0"×64</text>

    <!-- entry 1 -->
    <line x1="140" y1="90" x2="200" y2="90" stroke="#6b6b76" stroke-width="1.6" marker-end="url(#arr2)"/>
    <rect x="200" y="45" width="180" height="90" rx="8" fill="#1c2333" stroke="#8b8ba0"/>
    <text x="290" y="66" fill="#e6e6ef" text-anchor="middle">entry₁ · fact.captured</text>
    <text x="290" y="86" fill="#8b8ba0" text-anchor="middle">h₁ = SHA256(h₀ ‖ canon(d₁))</text>
    <rect x="220" y="96" width="140" height="24" rx="5" fill="#0d1117" stroke="#4b4b58"/>
    <text x="290" y="112" fill="#a8a8b8" text-anchor="middle" font-size="10.5">content_hash: a3f9…</text>

    <!-- entry 2 : the altered one -->
    <line x1="380" y1="90" x2="440" y2="90" stroke="#6b6b76" stroke-width="1.6" marker-end="url(#arr2)"/>
    <rect x="440" y="45" width="200" height="90" rx="8" fill="#2a1418" stroke="#ef4444" stroke-width="2"/>
    <text x="540" y="66" fill="#fca5a5" text-anchor="middle">entry₂ · case.state (altered)</text>
    <text x="540" y="86" fill="#fca5a5" text-anchor="middle" font-size="10.5">h₂ = SHA256(h₁ ‖ canon(d₂'))</text>
    <rect x="460" y="96" width="160" height="24" rx="5" fill="#0d1117" stroke="#ef4444"/>
    <text x="540" y="112" fill="#fca5a5" text-anchor="middle" font-size="10.5">recomputed ≠ stored</text>

    <!-- entry 3 -->
    <line x1="640" y1="90" x2="700" y2="90" stroke="#ef4444" stroke-width="1.6" marker-end="url(#arr2)" stroke-dasharray="3 3"/>
    <rect x="700" y="45" width="150" height="90" rx="8" fill="#2a1418" stroke="#ef4444" stroke-width="2"/>
    <text x="775" y="66" fill="#fca5a5" text-anchor="middle">entry₃</text>
    <text x="775" y="86" fill="#fca5a5" text-anchor="middle" font-size="10.5">h₃ built on wrong h₂</text>
    <rect x="715" y="96" width="120" height="24" rx="5" fill="#0d1117" stroke="#ef4444"/>
    <text x="775" y="112" fill="#fca5a5" text-anchor="middle" font-size="10.5">also invalid</text>

    <!-- broken_at marker -->
    <line x1="380" y1="150" x2="380" y2="180" stroke="#ef4444" stroke-width="1.4"/>
    <text x="380" y="196" fill="#fca5a5" text-anchor="middle" font-size="12">verify() → broken_at = 2</text>
  </g>

  <!-- second row: correct chain for contrast -->
  <g font-family="ui-monospace, monospace" font-size="11.5">
    <text x="20" y="235" fill="#a8a8b8" font-size="12">unaltered chain — every link recomputes and matches:</text>
    <rect x="20" y="250" width="90" height="44" rx="7" fill="#0f2318" stroke="#16a34a"/>
    <text x="65" y="276" fill="#4ade80" text-anchor="middle" font-size="11">h₀</text>
    <line x1="110" y1="272" x2="150" y2="272" stroke="#16a34a" stroke-width="1.6" marker-end="url(#arr2)"/>
    <rect x="150" y="250" width="90" height="44" rx="7" fill="#0f2318" stroke="#16a34a"/>
    <text x="195" y="276" fill="#4ade80" text-anchor="middle" font-size="11">h₁ ✓</text>
    <line x1="240" y1="272" x2="280" y2="272" stroke="#16a34a" stroke-width="1.6" marker-end="url(#arr2)"/>
    <rect x="280" y="250" width="90" height="44" rx="7" fill="#0f2318" stroke="#16a34a"/>
    <text x="325" y="276" fill="#4ade80" text-anchor="middle" font-size="11">h₂ ✓</text>
    <line x1="370" y1="272" x2="410" y2="272" stroke="#16a34a" stroke-width="1.6" marker-end="url(#arr2)"/>
    <rect x="410" y="250" width="90" height="44" rx="7" fill="#0f2318" stroke="#16a34a"/>
    <text x="455" y="276" fill="#4ade80" text-anchor="middle" font-size="11">h₃ ✓</text>
    <text x="530" y="277" fill="#8b8ba0" font-size="11.5">seq gap-free, every hᵢ = SHA256(hᵢ₋₁ ‖ canon(dᵢ))</text>
  </g>
</svg>
