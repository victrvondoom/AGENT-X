problem_type: appointment_cancelled
domain: appointments
label: Appointment cancelled or missed by the provider
summary: >
  A booked slot the provider did not honour — a clinic, a tradesperson, a service
  visit — where the loss is usually a wasted day rather than a fee.
prior: 0.05
provider_family: merchant
phrases:
  - they cancelled my appointment
  - no one turned up
  - didn't show up
  - missed appointment
  - rescheduled without telling me
required_entities: [merchant]
optional_entities: [booking, date, location, amount]
required_evidence:
  - kind: booking_confirmation
    why: Confirms a slot existed and when.
    critical: true
    satisfied_by: [email, screenshot, provider_record]
expected_facts:
  - appointment.at
  - appointment.status
  - notice.given
policies: [uk_cra_2015, merchant_terms]
resolution_strategies: [merchant_refund, goodwill_credit, rebooking, explanation]
escalation: [merchant_support, regulator_complaint]
risk: low
default_autonomy: 2
