problem_type: hotel_hidden_fees
domain: hospitality
label: Fees not disclosed at booking
summary: >
  Resort, cleaning, service or city fees added at or after check-in that were not
  in the price the user agreed to.
prior: 0.08
provider_family: hotel
phrases:
  - resort fee
  - cleaning fee
  - hidden fee
  - extra charges at checkout
  - service charge added
  - they added fees
  - more than the quoted price
patterns:
  - "(resort|cleaning|service|city|convenience)\\s+fee"
required_entities: [merchant, booking]
optional_entities: [amount, payment, date]
required_evidence:
  - kind: booking_confirmation
    why: The price the user agreed to is the reference point for anything added later.
    critical: true
    satisfied_by: [email, screenshot, order_page]
  - kind: invoice
    why: The final folio shows what was actually charged and under what line labels.
    critical: true
    satisfied_by: [receipt, transaction, bank_statement]
expected_facts:
  - booking.quoted_total
  - invoice.total
  - fee.items
  - fee.total
policies: [uk_cra_2015, us_ftc_junk_fees, merchant_terms, in_consumer_protection_2019]
resolution_strategies: [partial_refund, bill_correction, payment_dispute]
escalation: [merchant_support, platform_support, payment_provider, regulator_complaint]
deadlines:
  - label: Card scheme dispute window
    days: 120
    kind: scheme
    from_event: incident
    source: card_scheme_chargeback
risk: medium
default_autonomy: 2

