problem_type: baggage_lost
domain: travel
label: Baggage lost, delayed or damaged
summary: >
  Checked baggage did not arrive with the passenger. Liability is capped by
  treaty and the clock on written notice is short and unforgiving.
prior: 0.09
provider_family: airline
phrases:
  - lost my baggage
  - lost my luggage
  - baggage lost
  - luggage never arrived
  - bag didn't arrive
  - damaged suitcase
  - delayed baggage
patterns:
  - "(lost|missing|delayed|damaged).{0,20}(bag|baggage|luggage|suitcase)"
required_entities: [provider, booking]
optional_entities: [date, location, amount, case_ref]
required_evidence:
  - kind: baggage_tag
    why: The tag number is how the carrier's own tracing system identifies the bag.
    critical: true
    satisfied_by: [boarding_pass, provider_record, photograph]
  - kind: booking_confirmation
    why: Ties the bag to a carriage contract.
    critical: false
    satisfied_by: [email, provider_record]
  - kind: receipt
    why: Replacement purchases are recoverable, but only against receipts.
    critical: false
expected_facts:
  - baggage.tag
  - baggage.reported_at
  - flight.number
  - baggage.status
  - expenses.total
discriminators:
  - id: pir_filed
    question: Did you file a report at the airport (a PIR) before leaving?
    kind: choice
    options: ["Yes", "No", "Not sure"]
    why: A property irregularity report is the notice most carriers require, and its absence changes the whole strategy.
policies: [montreal_convention, eu261, merchant_terms]
resolution_strategies: [statutory_compensation, partial_refund, insurance_claim]
escalation: [merchant_support, regulator_complaint]
deadlines:
  - label: Written notice for damaged baggage
    days: 7
    kind: statutory
    from_event: incident
    source: montreal_convention
  - label: Written notice for delayed baggage
    days: 21
    kind: statutory
    from_event: incident
    source: montreal_convention
risk: medium
default_autonomy: 2

