problem_type: denied_boarding
domain: travel
label: Denied boarding or downgrade
summary: >
  The passenger held a confirmed reservation and was not carried, or was moved to
  a lower class. Involuntary denial carries the highest fixed compensation in the
  travel domain.
prior: 0.05
provider_family: airline
phrases:
  - denied boarding
  - overbooked
  - bumped from the flight
  - wouldn't let me board
  - downgraded my seat
required_entities: [provider, booking]
optional_entities: [date, amount, location]
required_evidence:
  - kind: boarding_pass
    why: Proves a confirmed reservation and presentation for boarding.
    critical: true
    satisfied_by: [booking_confirmation, provider_record]
expected_facts:
  - flight.number
  - boarding.denied_reason
  - boarding.volunteered
  - flight.distance_km
discriminators:
  - id: volunteered
    question: Did you volunteer to give up your seat, or were you denied boarding against your will?
    kind: choice
    options: ["I volunteered", "I was denied against my will", "Not sure"]
    why: Volunteering converts a fixed statutory entitlement into whatever was negotiated at the gate.
policies: [eu261, uk261, us_dot_denied_boarding]
resolution_strategies: [statutory_compensation, rebooking, merchant_refund]
escalation: [merchant_support, regulator_complaint]
deadlines:
  - label: EU261 claim limitation period
    days: 2190
    kind: statutory
    from_event: incident
    source: eu261
risk: medium
default_autonomy: 2
