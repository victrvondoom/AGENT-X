problem_type: flight_cancelled
domain: travel
label: Flight cancelled
summary: >
  The carrier cancelled the flight. Two separate entitlements apply and are
  routinely conflated: a refund or re-routing, and, unless notice was long enough,
  compensation on top.
prior: 0.14
provider_family: airline
phrases:
  - flight cancelled
  - flight canceled
  - they cancelled my flight
  - airline cancelled
  - cancelled my flight
patterns:
  - "(cancel).{0,20}(flight|plane)"
required_entities: [provider, booking]
optional_entities: [date, location, amount]
required_evidence:
  - kind: booking_confirmation
    why: Establishes the contract of carriage that was not performed.
    critical: true
    satisfied_by: [boarding_pass, email, provider_record]
  - kind: cancellation_notice
    why: The notice date decides whether compensation is owed at all.
    critical: false
    satisfied_by: [email, screenshot, provider_record]
expected_facts:
  - flight.number
  - flight.scheduled_departure
  - cancellation.notified_at
  - flight.distance_km
  - rebooking.offered
discriminators:
  - id: notice_days
    question: How much notice did the airline give you?
    kind: choice
    options: ["Less than 7 days", "7 to 13 days", "14 days or more", "Not sure"]
    why: Fourteen days notice extinguishes the compensation entitlement while leaving the refund one intact.
  - id: accepted_alternative
    question: Did you accept a rebooking, take a refund, or neither?
    kind: choice
    options: ["Rebooked", "Refunded", "Neither yet"]
    why: Accepting a voucher can waive a cash entitlement, so this changes the plan materially.
policies: [eu261, uk261, us_dot_refund, montreal_convention, merchant_terms]
resolution_strategies: [statutory_compensation, merchant_refund, rebooking]
escalation: [merchant_support, regulator_complaint, payment_provider]
deadlines:
  - label: EU261 claim limitation period
    days: 2190
    kind: statutory
    from_event: incident
    source: eu261
  - label: Refund due within 7 days of request
    days: 7
    kind: statutory
    from_event: first_contact
    source: eu261
risk: medium
default_autonomy: 2

