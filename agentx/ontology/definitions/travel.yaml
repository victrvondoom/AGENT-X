# ═══════════════════════════════════════════════════════════════════════════
# Carriage of a person: flights, and what a carrier owes when it goes wrong.
#
# Travel is the domain where statutory entitlement most often exceeds what the
# airline offers unprompted, so these definitions lean hard on the policy layer:
# the difference between "a voucher" and "EUR 400 in cash" is a citation, not a
# negotiation.
# ═══════════════════════════════════════════════════════════════════════════

problem_type: flight_delay_compensation
domain: travel
label: Flight delayed
summary: >
  A flight arrived late enough that a compensation scheme may apply. Entitlement
  turns on arrival delay at the final destination, distance, and whether the cause
  was within the carrier's control.
prior: 0.16
provider_family: airline
phrases:
  - flight was delayed
  - flight delay
  - delayed flight
  - landed late
  - missed my connection
  - hours late
  - compensation for delay
patterns:
  - "(delay|late).{0,30}(flight|plane|departure|arrival)"
  - "(\\d+)\\s*(hours?|hrs?)\\s*(late|delay)"
required_entities: [provider, booking]
optional_entities: [date, location, person, amount]
required_evidence:
  - kind: booking_confirmation
    why: Route and scheduled times are what the distance band and delay are measured against.
    critical: true
    satisfied_by: [boarding_pass, email, provider_record]
  - kind: email
    why: The carrier's own delay notice usually states the reason, which decides the extraordinary-circumstances defence.
    critical: false
    satisfied_by: [screenshot, provider_record]
expected_facts:
  - flight.number
  - flight.scheduled_arrival
  - flight.actual_arrival
  - flight.delay_minutes
  - flight.distance_km
  - flight.disruption_reason
discriminators:
  - id: arrival_delay
    question: How late did you arrive at your final destination?
    kind: choice
    options: ["Under 3 hours", "3 to 4 hours", "Over 4 hours", "Never arrived"]
    why: Under three hours there is no EU261 cash entitlement at all, however annoying the delay was.
    favours: {flight_delay_compensation: 0.3}
    disfavours: {flight_cancelled: 0.2}
  - id: cause_given
    question: Did the airline give a reason for the delay?
    kind: text
    why: Weather and air-traffic restrictions are extraordinary circumstances; a technical fault is not.
policies: [eu261, uk261, montreal_convention, us_dot_delay, merchant_terms]
resolution_strategies: [statutory_compensation, partial_refund, goodwill_credit]
escalation: [merchant_support, regulator_complaint]
deadlines:
  - label: EU261 claim limitation period
    days: 2190
    kind: statutory
    from_event: incident
    source: eu261
  - label: Airline response expected
    days: 14
    kind: merchant_sla
    from_event: first_contact
risk: medium
default_autonomy: 2

