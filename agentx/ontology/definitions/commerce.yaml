problem_type: refund_not_received
domain: commerce
label: Promised refund never arrived
summary: >
  The merchant agreed to refund and the money has not appeared. The dispute is no
  longer about the original problem — it is about a promise on the record.
prior: 0.11
provider_family: merchant
phrases:
  - still waiting for my refund
  - refund never came
  - they said they refunded
  - promised a refund
  - refund not received
  - no refund yet
patterns:
  - "(refund).{0,25}(not|never|still waiting|hasn.t)"
required_entities: [merchant, payment]
optional_entities: [order, amount, case_ref, date]
required_evidence:
  - kind: email
    why: The merchant's own confirmation that a refund was issued is the strongest possible lever.
    critical: true
    satisfied_by: [chat_transcript, screenshot, provider_record]
  - kind: bank_statement
    why: Shows the credit is genuinely absent, which the merchant will otherwise dispute.
    critical: true
    satisfied_by: [transaction]
expected_facts:
  - refund.promised_at
  - refund.amount
  - refund.reference
  - refund.received
policies: [uk_cra_2015, uk_ccr_2013, card_scheme_chargeback, us_fcba, in_rbi_harmonisation]
resolution_strategies: [merchant_refund, payment_dispute]
escalation: [merchant_support, payment_provider, regulator_complaint]
deadlines:
  - label: Statutory refund period for distance sales
    days: 14
    kind: statutory
    from_event: first_contact
    source: uk_ccr_2013
risk: medium
default_autonomy: 2

