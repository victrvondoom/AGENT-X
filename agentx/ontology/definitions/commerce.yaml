problem_type: return_refused
domain: commerce
label: Return or cancellation refused
summary: >
  The merchant will not accept a return, or is applying a restocking or
  cancellation charge the user believes is not lawful.
prior: 0.09
provider_family: merchant
phrases:
  - won't accept my return
  - refused my return
  - they refuse to refund
  - no returns policy
  - restocking fee
  - refuses to refund me
patterns:
  - "(refuse|won.t|will not).{0,20}(refund|return|accept)"
required_entities: [merchant, order]
optional_entities: [product, payment, amount, case_ref]
required_evidence:
  - kind: order_confirmation
    why: Purchase date and channel decide whether a distance-selling cancellation right exists.
    critical: true
    satisfied_by: [receipt, invoice, provider_record]
  - kind: email
    why: The refusal itself, in the merchant's words.
    critical: false
    satisfied_by: [chat_transcript, screenshot]
expected_facts:
  - order.id
  - order.purchased_at
  - order.channel
  - refusal.reason
policies: [uk_ccr_2013, uk_cra_2015, us_ftc_mito, in_consumer_protection_2019, merchant_terms]
resolution_strategies: [merchant_refund, partial_refund, payment_dispute]
escalation: [merchant_support, payment_provider, regulator_complaint]
deadlines:
  - label: Cooling-off period for distance contracts
    days: 14
    kind: statutory
    from_event: incident
    source: uk_ccr_2013
risk: medium
default_autonomy: 2
