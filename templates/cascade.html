<!doctype html>
<html lang="en" data-theme="night">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Erasure Cascade · Agent X</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 28 24' fill='none' stroke='%23ffffff' stroke-width='2.4' stroke-linecap='round'><path d='M16.97 7.97A7.2 7.2 0 1 0 16.97 16.03'/><circle cx='19.6' cy='12' r='1.25' fill='%23ffffff' stroke='none'/><circle cx='22.6' cy='12' r='0.95' fill='%23ffffff' stroke='none' opacity='.6'/><circle cx='25.2' cy='12' r='0.62' fill='%23ffffff' stroke='none' opacity='.32'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════════════════════════════════════
   ERASURE CASCADE
   The product's argument, rendered. Everything the engine does in one atomic
   transaction has, until now, only existed as JSON: the person's exclusive
   knowledge is destroyed, entities shared with surviving subjects lose one
   thread and stay, authoritative material is spared because it holds no
   personal data, and a subject under legal hold is refused outright.

   The classification here is not decorative — it re-implements the exact
   predicates core/forget.py uses, so what you watch is what the database
   actually did. See classify().
   ═══════════════════════════════════════════════════════════════════════════ */
:root{
  --void:#08080a; --ink:20,20,24; --bone:#edeae2; --bone-dim:#9a978f;
  --hair:rgba(237,234,226,.10);
  --evidence:#dce9ff;      /* cool: a person's records — erasable */
  --authority:#f2e4cc;     /* warm: statute — survives */
  --shared:#b9b9c0;        /* neutral: shared with a surviving subject */
  --refuse:#ff8f6b;        /* the only non-white in the palette, and it is
                              reserved for a refusal — the rarest event here */
}
:root[data-theme="day"]{
  --void:#f5f3ee; --ink:255,255,255; --bone:#1b1a17; --bone-dim:#6d6a62;
  --hair:rgba(27,26,23,.14);
  --evidence:#4d6b8a; --authority:#8a6f3e; --shared:#6f6d67; --refuse:#c0472a;
}
*{box-sizing:border-box}
body{margin:0;background:var(--void);color:var(--bone);overflow:hidden;
  font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased;
  transition:background .45s ease,color .45s ease}
.serif{font-family:'Instrument Serif',Georgia,serif;font-weight:400}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace}
canvas{display:block;position:fixed;inset:0;z-index:0}

.panel{position:fixed;z-index:2;background:rgba(var(--ink),.55);
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  border:1px solid var(--hair);border-radius:14px}

#hud{top:1.1rem;left:1.1rem;padding:1rem 1.15rem;width:min(21rem,calc(100vw - 2.2rem))}
#hud h1{margin:0;font-size:1.25rem;letter-spacing:-.01em}
#hud .sub{color:var(--bone-dim);font-size:.75rem;margin-top:.3rem;line-height:1.5}

.row{display:flex;align-items:center;gap:.5rem;margin-top:.85rem}
select,button{font-family:inherit;font-size:.8125rem;border-radius:9px;
  border:1px solid var(--hair);background:rgba(var(--ink),.6);color:var(--bone);
  padding:.5rem .7rem;cursor:pointer;transition:border-color .2s,box-shadow .2s}
select{flex:1;min-width:0}
button:hover{border-color:var(--bone-dim)}
button.primary{background:var(--bone);color:var(--void);font-weight:600;border:none;
  box-shadow:0 0 22px rgba(255,255,255,.18)}
button.primary:hover{box-shadow:0 0 34px rgba(255,255,255,.3)}
button:disabled{opacity:.4;cursor:not-allowed}

#legend{bottom:1.1rem;left:1.1rem;padding:.8rem .95rem;font-size:.72rem;line-height:1.9}
#legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:.5rem;
  vertical-align:middle}
#legend .k{color:var(--bone-dim)}

#readout{top:1.1rem;right:1.1rem;padding:.9rem 1rem;width:min(19rem,calc(100vw - 2.2rem));
  font-size:.75rem;line-height:1.65;max-height:60vh;overflow:auto}
#readout .t{font-size:.62rem;letter-spacing:.2em;text-transform:uppercase;
  color:var(--bone-dim);margin-bottom:.5rem}
#readout .line{display:flex;justify-content:space-between;gap:1rem;padding:.16rem 0}
#readout .line span:last-child{color:var(--bone-dim)}
#readout .refused{color:var(--refuse);font-weight:600}

#toast{position:fixed;z-index:3;left:50%;top:1.1rem;transform:translateX(-50%) translateY(-140%);
  padding:.7rem 1.1rem;border-radius:999px;font-size:.8125rem;
  background:rgba(var(--ink),.85);backdrop-filter:blur(18px);
  border:1px solid var(--hair);transition:transform .5s cubic-bezier(.16,1,.3,1)}
#toast.show{transform:translateX(-50%) translateY(0)}
#toast.refuse{border-color:var(--refuse);color:var(--refuse)}

.link{position:fixed;z-index:2;bottom:1.1rem;right:1.1rem;font-size:.75rem;
  color:var(--bone-dim);text-decoration:none}
.link:hover{color:var(--bone)}
#theme{position:fixed;z-index:3;top:1.1rem;left:50%;transform:translateX(-50%);
  width:32px;height:32px;border-radius:999px;display:grid;place-items:center;padding:0}
@media (max-width:820px){
  #readout{display:none}
  #hud{width:calc(100vw - 2.2rem)}
}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="hud" class="panel">
  <h1 class="serif">Erasure Cascade</h1>
  <div class="sub">Watch what an erasure destroys — and what it is not allowed to touch.</div>
  <div class="row">
    <select id="subject"><option>loading…</option></select>
  </div>
  <div class="row">
    <button id="run" class="primary" style="flex:1">Forget &amp; Prove</button>
    <button id="reset">Reset</button>
  </div>
  <div class="row" style="margin-top:.55rem">
    <button id="hold" style="flex:1">Toggle legal hold</button>
  </div>
</div>

<div id="legend" class="panel">
  <div><i style="background:var(--evidence)"></i><span class="k">user evidence</span> — erased with the subject</div>
  <div><i style="background:var(--authority)"></i><span class="k">authoritative</span> — statute, never erased</div>
  <div><i style="background:var(--shared)"></i><span class="k">shared</span> — kept for a surviving subject</div>
</div>

<div id="readout" class="panel">
  <div class="t">Receipt</div>
  <div id="rlines"><div class="line"><span>select a subject</span><span>—</span></div></div>
</div>

<button id="theme" class="panel" title="Day / night"><span id="ticon">☾</span></button>
<div id="toast"></div>
<a class="link" href="/app">← back to the app</a>

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.module.js"}}
</script>
<script type="module">
import * as THREE from 'three';

const $ = id => document.getElementById(id);
const WS = new URLSearchParams(location.search).get('workspace') || 'default';

/* ── theme ─────────────────────────────────────────────────────────────── */
const TKEY = 'agentx.theme';
function applyTheme(m, persist){
  document.documentElement.setAttribute('data-theme', m);
  $('ticon').textContent = m === 'day' ? '☀' : '☾';
  if (persist) localStorage.setItem(TKEY, m);
  THEME = m;
  if (scene) scene.background = new THREE.Color(css('--void'));
  refreshColors();
}
let THEME = (localStorage.getItem(TKEY) === 'day' || localStorage.getItem(TKEY) === 'night')
  ? localStorage.getItem(TKEY)
  : (matchMedia('(prefers-color-scheme: light)').matches ? 'day' : 'night');
$('theme').onclick = () => applyTheme(THEME === 'day' ? 'night' : 'day', true);

const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();

/* ── scene ─────────────────────────────────────────────────────────────── */
const canvas = $('c');
const renderer = new THREE.WebGLRenderer({canvas, antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.75));
renderer.setSize(innerWidth, innerHeight);
let scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(48, innerWidth/innerHeight, .1, 400);
camera.position.set(0, 0, 62);
const root = new THREE.Group();
scene.add(root);

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
}, {passive:true});

/* ── data ──────────────────────────────────────────────────────────────── */
let G = {nodes:[], edges:[], holds:{}};
let SUBJECT = null;
let objects = {nodes:[], edges:[], labels:[]};
let particles = null;
let running = false;

const toast = (msg, refuse) => {
  const t = $('toast');
  t.textContent = msg;
  t.className = 'show' + (refuse ? ' refuse' : '');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => { t.className = ''; }, 4200);
};

/* ── THE RULE ──────────────────────────────────────────────────────────────
   A direct transcription of core/forget.py. Kept deliberately close to the SQL
   so the animation cannot drift away from what the database actually does:

     exclusive  = subject present AND the only subject AND source_kind <> authoritative
     shared     = subject present AND at least one other subject survives
     spared     = subject present AND source_kind = authoritative
     untouched  = subject not present
   ────────────────────────────────────────────────────────────────────────── */
function classify(node, subject){
  const subs = node.subjects || [];
  if (!subs.includes(subject)) return 'untouched';
  if (node.source_kind === 'authoritative') return 'spared';
  const others = subs.filter(s => s !== subject);
  return others.length ? 'shared' : 'exclusive';
}

function nodeColor(node){
  if (!SUBJECT) return node.source_kind === 'authoritative' ? css('--authority') : css('--evidence');
  const k = classify(node, SUBJECT);
  if (k === 'spared')   return css('--authority');
  if (k === 'shared')   return css('--shared');
  if (k === 'exclusive')return css('--evidence');
  return css('--shared');
}

function refreshColors(){
  const day = THEME === 'day';
  objects.nodes.forEach(m => {
    const c = new THREE.Color(nodeColor(m.userData.n));
    m.material.color.copy(c);
    const h = m.userData.halo;
    if (h){
      h.material.color.copy(c);
      // blending must follow the theme, not just the colour — see the halo above
      h.material.blending = day ? THREE.NormalBlending : THREE.AdditiveBlending;
      h.material.opacity = day ? .16 : .20;
      h.material.needsUpdate = true;
    }
  });
  objects.labels.forEach(l => { l.material.color = new THREE.Color(css('--bone')); });
  objects.edges.forEach(e => e.material.color.set(css('--hair')));
}

/* ── layout: a small force sim, run once, then frozen ──────────────────────
   Real force-directed layout rather than a circle, so clusters read as
   clusters. Runs on the CPU for a few hundred ticks at load and is then
   static — nothing per-frame, so the cascade animation owns the frame budget. */
function layout(nodes, edges){
  const P = nodes.map(() => ({
    x:(Math.random()-.5)*46, y:(Math.random()-.5)*32, z:(Math.random()-.5)*26,
    vx:0, vy:0, vz:0,
  }));
  const idx = {}; nodes.forEach((n,i) => idx[n.id] = i);
  const E = edges.filter(e => idx[e.source] !== undefined && idx[e.target] !== undefined)
                 .map(e => [idx[e.source], idx[e.target]]);
  for (let step = 0; step < 320; step++){
    for (let i = 0; i < P.length; i++){          // repulsion
      for (let j = i+1; j < P.length; j++){
        let dx = P[i].x-P[j].x, dy = P[i].y-P[j].y, dz = P[i].z-P[j].z;
        let d2 = dx*dx+dy*dy+dz*dz + .01;
        const f = 105 / d2;
        const d = Math.sqrt(d2);
        dx/=d; dy/=d; dz/=d;
        P[i].vx += dx*f; P[i].vy += dy*f; P[i].vz += dz*f;
        P[j].vx -= dx*f; P[j].vy -= dy*f; P[j].vz -= dz*f;
      }
    }
    for (const [a,b] of E){                       // springs
      const dx = P[b].x-P[a].x, dy = P[b].y-P[a].y, dz = P[b].z-P[a].z;
      const d = Math.sqrt(dx*dx+dy*dy+dz*dz) + .01;
      const f = (d - 9.5) * .015;
      P[a].vx += dx/d*f; P[a].vy += dy/d*f; P[a].vz += dz/d*f;
      P[b].vx -= dx/d*f; P[b].vy -= dy/d*f; P[b].vz -= dz/d*f;
    }
    for (const p of P){                           // centring + damping
      p.vx -= p.x*.0034; p.vy -= p.y*.0034; p.vz -= p.z*.0034;
      p.x += p.vx; p.y += p.vy; p.z += p.vz;
      p.vx *= .82; p.vy *= .82; p.vz *= .82;
    }
  }
  return P;
}

/* ── halo texture ──────────────────────────────────────────────────────────
   A sprite with no map is an opaque QUAD, so an unmapped halo renders as a
   square block rather than a glow. Built once and shared by every node. */
let _halo = null;
function haloTex(){
  if (_halo) return _halo;
  const cv = document.createElement('canvas');
  cv.width = cv.height = 128;
  const x = cv.getContext('2d');
  const g = x.createRadialGradient(64, 64, 0, 64, 64, 64);
  g.addColorStop(0, 'rgba(255,255,255,1)');
  g.addColorStop(.35, 'rgba(255,255,255,.42)');
  g.addColorStop(1, 'rgba(255,255,255,0)');
  x.fillStyle = g;
  x.fillRect(0, 0, 128, 128);
  _halo = new THREE.CanvasTexture(cv);
  return _halo;
}

/* ── label sprites ─────────────────────────────────────────────────────── */
function labelSprite(text){
  const cv = document.createElement('canvas');
  const ctx = cv.getContext('2d');
  const F = 30;
  ctx.font = `500 ${F}px Inter, sans-serif`;
  cv.width = Math.ceil(ctx.measureText(text).width) + 16;
  cv.height = F + 14;
  const c2 = cv.getContext('2d');
  c2.font = `500 ${F}px Inter, sans-serif`;
  c2.fillStyle = '#fff';
  c2.textBaseline = 'middle';
  c2.fillText(text, 8, cv.height/2);
  const tex = new THREE.CanvasTexture(cv);
  tex.minFilter = THREE.LinearFilter;
  const spr = new THREE.Sprite(new THREE.SpriteMaterial({
    map:tex, transparent:true, depthWrite:false, opacity:.75,
    sizeAttenuation:false,   /* constant screen size: perspective made near labels
                                gigantic and far ones unreadable */
    color:new THREE.Color(css('--bone')),
  }));
  const H = 0.030;
  spr.scale.set(cv.width/cv.height * H, H, 1);
  return spr;
}

/* ── build ─────────────────────────────────────────────────────────────── */
function clearScene(){
  root.clear();
  objects = {nodes:[], edges:[], labels:[]};
  if (particles){ particles.geometry.dispose(); particles.material.dispose(); particles = null; }
}

function build(){
  clearScene();
  const P = layout(G.nodes, G.edges);
  const pos = {};
  G.nodes.forEach((n,i) => pos[n.id] = P[i]);

  const sphere = new THREE.SphereGeometry(1, 20, 16);
  G.nodes.forEach((n,i) => {
    const deg = G.edges.filter(e => e.source===n.id || e.target===n.id).length;
    const r = 0.72 + Math.min(deg,7) * 0.12;
    const m = new THREE.Mesh(sphere, new THREE.MeshBasicMaterial({
      color:new THREE.Color(nodeColor(n)), transparent:true, opacity:.95,
    }));
    m.position.set(P[i].x, P[i].y, P[i].z);
    m.scale.setScalar(r);
    m.userData = {n, home:m.position.clone(), r};
    root.add(m); objects.nodes.push(m);

    // Soft halo so a node reads as luminous rather than as a plastic ball.
    // Additive blending only works over a dark ground — adding light to a bright
    // background clips to white, which turned every halo into a white square in
    // day mode. Day therefore uses normal blending at low alpha instead.
    const halo = new THREE.Sprite(new THREE.SpriteMaterial({
      map: haloTex(), color:new THREE.Color(nodeColor(n)), transparent:true,
      opacity: THEME === 'day' ? .16 : .20, depthWrite:false,
      blending: THEME === 'day' ? THREE.NormalBlending : THREE.AdditiveBlending,
    }));
    halo.scale.setScalar(r * 7);
    halo.position.copy(m.position);
    root.add(halo);
    m.userData.halo = halo;

    if (G.nodes.length <= 60){
      const l = labelSprite(n.name);
      l.position.set(P[i].x, P[i].y + r + 1.5, P[i].z);
      root.add(l); objects.labels.push(l);
      m.userData.label = l;
    }
  });

  const lineMat = new THREE.LineBasicMaterial({
    color:new THREE.Color(css('--hair')), transparent:true, opacity:.55,
  });
  G.edges.forEach(e => {
    const a = pos[e.source], b = pos[e.target];
    if (!a || !b) return;
    const g = new THREE.BufferGeometry().setFromPoints([
      new THREE.Vector3(a.x,a.y,a.z), new THREE.Vector3(b.x,b.y,b.z)]);
    const ln = new THREE.Line(g, lineMat.clone());
    ln.userData = {e};
    root.add(ln); objects.edges.push(ln);
  });

  scene.background = new THREE.Color(css('--void'));
  fitCamera();
}

function fitCamera(){
  const box = new THREE.Box3().setFromObject(root);
  if (box.isEmpty()) return;
  const size = box.getSize(new THREE.Vector3()).length() || 40;
  camera.position.set(0, 0, size * 1.02);   // margin so edge nodes and labels stay in frame
  camera.lookAt(0, 0, 0);
}

/* ── the cascade ───────────────────────────────────────────────────────── */
function receipt(lines){
  $('rlines').innerHTML = lines.map(([k,v,cls]) =>
    `<div class="line"><span class="${cls||''}">${k}</span><span>${v}</span></div>`).join('');
}

async function runCascade(){
  if (running || !SUBJECT) return;

  // A held subject is refused, exactly as the API refuses it — nothing is destroyed.
  if (G.holds[SUBJECT]){
    toast('Erasure refused — ' + G.holds[SUBJECT], true);
    receipt([
      ['Erasure', 'REFUSED', 'refused'],
      ['Reason', G.holds[SUBJECT]],
      ['Basis', 'GDPR Art. 17(3)'],
      ['Destroyed', 'nothing'],
    ]);
    objects.nodes.forEach(m => { m.userData.shield = 1; });
    return;
  }

  running = true; $('run').disabled = true;
  const groups = {exclusive:[], shared:[], spared:[], untouched:[]};
  objects.nodes.forEach(m => groups[classify(m.userData.n, SUBJECT)].push(m));

  // edges touching a doomed node snap first — the graph visibly loses its threads
  const doomed = new Set(groups.exclusive.map(m => m.userData.n.id));
  const cutting = objects.edges.filter(l => doomed.has(l.userData.e.source) || doomed.has(l.userData.e.target));
  cutting.forEach(l => l.userData.cut = performance.now());

  // then the nodes dissolve into a particle burst
  setTimeout(() => {
    const pts = [];
    groups.exclusive.forEach(m => {
      for (let i = 0; i < 26; i++){
        pts.push(m.position.x + (Math.random()-.5), m.position.y + (Math.random()-.5),
                 m.position.z + (Math.random()-.5));
      }
      m.userData.dissolve = performance.now();
    });
    if (pts.length){
      const g = new THREE.BufferGeometry();
      g.setAttribute('position', new THREE.Float32BufferAttribute(pts, 3));
      const vel = new Float32Array(pts.length);
      for (let i = 0; i < vel.length; i += 3){
        vel[i] = (Math.random()-.5)*.16; vel[i+1] = (Math.random()-.5)*.16 + .05;
        vel[i+2] = (Math.random()-.5)*.16;
      }
      g.userData = {vel, born:performance.now()};
      particles = new THREE.Points(g, new THREE.PointsMaterial({
        color:new THREE.Color(css('--evidence')), size:.55, transparent:true,
        opacity:.9, depthWrite:false, blending:THREE.AdditiveBlending,
      }));
      root.add(particles);
    }
    groups.spared.forEach(m => { m.userData.pulse = performance.now(); });
  }, 620);

  receipt([
    ['Subject', SUBJECT],
    ['Exclusive nodes destroyed', groups.exclusive.length],
    ['Edges severed', cutting.length],
    ['Shared nodes retained', groups.shared.length],
    ['Authoritative spared', groups.spared.length],
    ['Key', 'crypto-shredded'],
  ]);
  toast(groups.spared.length
    ? `Erased ${SUBJECT} — ${groups.spared.length} authoritative node(s) left standing`
    : `Erased ${SUBJECT}`);

  setTimeout(() => { running = false; }, 2200);
}

/* ── frame ─────────────────────────────────────────────────────────────── */
const clock = new THREE.Clock();
function frame(){
  const t = performance.now();
  const dt = Math.min(clock.getDelta(), .05);
  root.rotation.y += dt * .06;                       // slow drift, keeps depth readable

  objects.edges.forEach(l => {
    if (l.userData.cut){
      const k = Math.min(1, (t - l.userData.cut) / 520);
      l.material.opacity = .55 * (1 - k);
    }
  });

  objects.nodes.forEach(m => {
    if (m.userData.dissolve){
      const k = Math.min(1, (t - m.userData.dissolve) / 700);
      m.material.opacity = .95 * (1 - k);
      m.scale.setScalar(m.userData.r * (1 - k * .8));
      if (m.userData.halo) m.userData.halo.material.opacity = .20 * (1 - k);
      if (m.userData.label) m.userData.label.material.opacity = .72 * (1 - k);
    }
    if (m.userData.pulse){                            // spared: a brief confident flare
      const k = (t - m.userData.pulse) / 900;
      const e = k < 1 ? Math.sin(k * Math.PI) : 0;
      m.scale.setScalar(m.userData.r * (1 + e * .55));
      if (m.userData.halo) m.userData.halo.material.opacity = .20 + e * .5;
      if (k >= 1) m.userData.pulse = 0;
    }
    if (m.userData.shield){                           // refused: everything shivers, nothing dies
      const k = (t - (m.userData.shieldT || (m.userData.shieldT = t))) / 800;
      const e = k < 1 ? Math.sin(k * Math.PI * 3) * .06 : 0;
      m.scale.setScalar(m.userData.r * (1 + e));
      if (k >= 1){ m.userData.shield = 0; m.userData.shieldT = 0; }
    }
    if (m.userData.halo) m.userData.halo.position.copy(m.position);
  });

  if (particles){
    const p = particles.geometry.attributes.position;
    const v = particles.geometry.userData.vel;
    for (let i = 0; i < p.count; i++){
      p.setXYZ(i, p.getX(i)+v[i*3], p.getY(i)+v[i*3+1], p.getZ(i)+v[i*3+2]);
    }
    p.needsUpdate = true;
    const age = (t - particles.geometry.userData.born) / 2400;
    particles.material.opacity = Math.max(0, .9 * (1 - age));
    if (age >= 1){ root.remove(particles); particles.geometry.dispose();
                   particles.material.dispose(); particles = null; }
  }

  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}

/* ── drag to orbit ─────────────────────────────────────────────────────── */
const drag = {on:false, lx:0, ly:0};
canvas.addEventListener('pointerdown', e => { drag.on = true; drag.lx = e.clientX; drag.ly = e.clientY; });
addEventListener('pointermove', e => {
  if (!drag.on) return;
  root.rotation.y += (e.clientX - drag.lx) * .005;
  root.rotation.x = Math.max(-1.2, Math.min(1.2, root.rotation.x + (e.clientY - drag.ly) * .004));
  drag.lx = e.clientX; drag.ly = e.clientY;
});
for (const ev of ['pointerup','pointercancel','pointerleave'])
  addEventListener(ev, () => { drag.on = false; });

/* ── load ──────────────────────────────────────────────────────────────── */
async function load(){
  try {
    const r = await fetch('/api/graph?workspace=' + encodeURIComponent(WS));
    G = await r.json();
    G.holds = G.holds || {};
  } catch {
    toast('could not reach /api/graph', true);
    return;
  }
  const subs = [...new Set(G.nodes.flatMap(n => n.subjects || []))].sort();
  $('subject').innerHTML = subs.length
    ? subs.map(s => `<option value="${s}">${s}${G.holds[s] ? '  · held' : ''}</option>`).join('')
    : '<option value="">no subjects in this workspace</option>';
  SUBJECT = subs[0] || null;
  build();
  if (SUBJECT) preview();
}

function preview(){
  const g = {exclusive:0, shared:0, spared:0};
  G.nodes.forEach(n => { const k = classify(n, SUBJECT); if (k in g) g[k]++; });
  receipt([
    ['Subject', SUBJECT + (G.holds[SUBJECT] ? '  (held)' : '')],
    ['Would destroy', g.exclusive],
    ['Would retain (shared)', g.shared],
    ['Would spare (authoritative)', g.spared],
    ...(G.holds[SUBJECT] ? [['Erasure', 'REFUSED', 'refused']] : []),
  ]);
}

$('subject').onchange = e => { SUBJECT = e.target.value; refreshColors(); preview(); };
$('run').onclick = runCascade;
$('reset').onclick = () => { running = false; $('run').disabled = false; build(); preview(); };
$('hold').onclick = async () => {
  if (!SUBJECT) return;
  const held = !!G.holds[SUBJECT];
  try {
    const r = await fetch(held ? '/api/hold/release' : '/api/hold', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify(held
        ? {subject:SUBJECT, workspace:WS}
        : {subject:SUBJECT, reason:'demonstration hold', workspace:WS}),
    });
    if (r.status === 401){ toast('writes are token-gated — set the token in the app', true); return; }
    if (!r.ok){ toast('hold change failed (' + r.status + ')', true); return; }
    if (held) delete G.holds[SUBJECT]; else G.holds[SUBJECT] = 'demonstration hold';
    toast(held ? 'Legal hold released — erasure permitted' : 'Legal hold placed — erasure will be refused', !held);
    preview();
  } catch { toast('hold change failed', true); }
};

applyTheme(THEME, false);
load();
frame();
</script>
