name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref - a stale red/green result on an
# outdated commit is worse than no result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        working-directory: backend
        # The heaviest SDKs (ADK, Strands, chromadb) are not needed to
        # exercise the security-critical logic under test, so CI installs
        # only what the suite actually imports. Import-time breakage in the
        # full set is caught by the `imports` job below.
        #
        # The Firestore and Pub/Sub clients ARE required: tests/test_cloud_backends.py
        # mocks their behaviour but still imports the real modules, and the
        # Pub/Sub topology test exists because a missing topic made every
        # enqueue 404 on a fresh project. Skipping it in CI would leave that
        # regression unguarded exactly where it matters.
        run: |
          python -m pip install --upgrade pip
          pip install pytest httpx fastapi pydantic python-dotenv requests google-cloud-pubsub google-cloud-firestore

      - name: Run tests
        working-directory: backend
        run: python -m pytest -q

  frontend:
    name: Frontend (typecheck, lint, test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      # Next.js generates route/layout types (LayoutProps, PageProps and the
      # rest) into .next/types during dev or build. A clean CI checkout has
      # never run either, so tsc failed on `LayoutProps<"/">` in layout.tsx
      # while passing locally, where a previous build had already emitted
      # them. typegen produces exactly those definitions without paying for
      # a full build first.
      - name: Generate Next.js route types
        run: npx next typegen

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npx eslint src --max-warnings=0

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fail if a real API key or .env was committed
        run: |
          # A security product leaking its own credentials would be the most
          # embarrassing possible failure - check the tree, not just the diff.
          if git ls-files | grep -E '(^|/)\.env$|(^|/)\.env\.'; then
            echo "::error::A .env file is tracked in git."
            exit 1
          fi
          if git grep -nIE 'AIza[0-9A-Za-z_-]{35}|AKIA[0-9A-Z]{16}|ghp_[0-9A-Za-z]{36}' -- . ':!*.lock' ':!**/tests/**'; then
            echo "::error::A credential-shaped string is committed."
            exit 1
          fi
          echo "No committed credentials found."
